name: Security & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Run Secret Scan (Rule 1 & Rule 2)
        run: npm run security:scan

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit Dependencies for High/Critical Vulnerabilities (Rule 18)
        run: npm audit --audit-level=high

      - name: Run Type Check
        run: npm run typecheck

      - name: Run Security & Integration Test Suite (RLS, IDOR, Mass Assignment, XSS, File Upload, CORS, Rate Limit)
        run: npm test
